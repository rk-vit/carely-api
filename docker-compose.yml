services:
  postgres:
    image: postgres:17
    container_name: carely-postgres
    environment:
      POSTGRES_DB: carely
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  carely-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carely-api
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/carely
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
volumes:
  postgres-data:
