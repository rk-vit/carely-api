name: Carely Pre-deployment Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: carely
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d carely"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: carely
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..30}; do
            if pg_isready \
              -h "$PGHOST" \
              -p "$PGPORT" \
              -U "$PGUSER" \
              -d "$PGDATABASE"; then
              exit 0
            fi

            sleep 2
          done

          echo "PostgreSQL did not become ready"
          exit 1

      - name: Apply database migrations for jOOQ
        shell: bash
        run: |
          set -euo pipefail

          migration_dir="db-migrations/src/main/resources/db/migration"

          while IFS= read -r migration_file; do
            echo "Applying migration: ${migration_file}"
            psql \
              -v ON_ERROR_STOP=1 \
              -f "${migration_dir}/${migration_file}"
          done < <(
            find "$migration_dir" \
              -maxdepth 1 \
              -type f \
              -name 'V*.sql' \
              -printf '%f\n' |
            sort -V
          )

      - name: Build and test backend
        run: mvn -B clean verify -Dspring.flyway.enabled=false
