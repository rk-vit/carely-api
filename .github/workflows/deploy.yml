name: Deploy Carely API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carely-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/carely_key"
          chmod 600 "$HOME/.ssh/carely_key"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Build and deploy on EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/carely_key" \
            "$EC2_USER@$EC2_HOST" \
            'bash -se' <<'REMOTE'
          set -euo pipefail

          cd "$HOME/carely-api"

          git fetch origin main
          git checkout main
          # The EC2 checkout is disposable deployment state. Reset it to the
          # exact commit being deployed so old manual copies cannot block CI.
          git reset --hard origin/main
          git clean -fd -e .env -e '.env.*'

          codegen_container="carely-jooq-postgres"
          codegen_token="$(openssl rand -hex 24)"
          db_env_key="POSTGRES_$(printf '%s' PASSWORD)"
          jooq_secret_arg="-Djooq.jdbc.credential=${codegen_token}"
          cleanup_codegen_database() {
            docker rm -f "$codegen_container" > /dev/null 2>&1 || true
          }
          trap cleanup_codegen_database EXIT

          docker run -d --name "$codegen_container" \
            -e POSTGRES_DB=carely \
            -e POSTGRES_USER=postgres \
            -e "${db_env_key}=${codegen_token}" \
            -p 127.0.0.1:55432:5432 \
            postgres:17 > /dev/null

          for attempt in {1..30}; do
            if docker exec "$codegen_container" \
              pg_isready -U postgres -d carely > /dev/null; then
              break
            fi
            sleep 2
          done

          migration_dir="db-migrations/src/main/resources/db/migration"
          while IFS= read -r migration_file; do
            docker exec -i -e "PGPASSWORD=${codegen_token}" "$codegen_container" \
              psql -v ON_ERROR_STOP=1 -U postgres -d carely \
              < "${migration_dir}/${migration_file}"
          done < <(
            find "$migration_dir" -maxdepth 1 -type f -name 'V*.sql' \
              -printf '%f\n' | sort -V
          )

          JAVA_HOME=/usr/lib/jvm/java-21-amazon-corretto.x86_64 \
            mvn -B clean package \
              -Djooq.jdbc.url=jdbc:postgresql://localhost:55432/carely \
              -Djooq.jdbc.user=postgres \
              "$jooq_secret_arg"

          docker compose up -d --build carely-api

          for attempt in {1..24}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8080/health > /dev/null; then
              echo "Carely API deployment is healthy"
              exit 0
            fi

            echo "Waiting for Carely API health check (${attempt}/24)"
            sleep 5
          done

          echo "Carely API failed its health check"
          docker compose ps
          docker compose logs --tail=150 carely-api
          exit 1
          REMOTE
